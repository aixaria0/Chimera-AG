name: Real local model inference
on:
  workflow_dispatch:
  push:
    paths:
      - chimera/product.py
      - chimera/product_integrations.py
      - chimera/council.py
      - chimera/live_benchmark.py
      - benchmarks/live_arithmetic_smoke.json
      - web/**
      - Dockerfile
      - compose.yaml
      - scripts/real_model_smoke.py
      - .github/workflows/real-model.yml
  pull_request:
    paths:
      - chimera/product.py
      - web/**
      - Dockerfile
      - compose.yaml
      - scripts/real_model_smoke.py
      - .github/workflows/real-model.yml
permissions:
  contents: read
jobs:
  real-ollama-inference:
    name: Real Ollama model on GitHub-hosted CPU
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      CHIMERA_MODEL: smollm2:135m
      CHIMERA_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start actual application and actual Ollama container
        run: docker compose up -d --build
      - name: Assert real model was automatically downloaded into Ollama
        run: docker compose exec -T ollama ollama list
      - name: Generate real model response through browser product API
        run: python scripts/real_model_smoke.py
      - name: Compare single model and real Council on paired fixed tasks
        run: |
          docker compose exec -T chimera python -m chimera.live_benchmark \
            --suite benchmarks/live_arithmetic_smoke.json \
            --model smollm2:135m --ollama-host http://ollama:11434 \
            --output /tmp/chimera-paired-report.json --execute
          docker compose exec -T chimera python -c "import json; r=json.load(open('/tmp/chimera-paired-report.json')); assert r['tasks']==2; assert all(x['single']['generated_tokens'] and x['council']['generated_tokens'] and x['council']['requests_used']==4 for x in r['results']); print('REAL_PAIRED_MODEL_AND_COUNCIL_INFERENCE=PASS')"
      - name: Show service logs only on failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop temporary test machine containers
        if: always()
        run: docker compose down
