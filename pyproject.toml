[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chimera-coordination"
version = "0.3.0"
description = "Bounded hybrid agent coordination and model discovery"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
cloud = ["openai>=1.0"]
test = ["pytest>=8"]
[project.scripts]
chimera = "chimera.cli:main"
chimera-fabric = "chimera.fabric_cli:main"
chimera-discover = "chimera.discover_cli:main"
chimera-free-pool = "chimera.free_pool:run_cli"
[tool.setuptools.packages.find]
include = ["chimera*"]
