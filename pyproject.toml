[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chimera-coordination"
version = "0.8.0"
description = "Bounded hybrid agent coordination and model discovery"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
cloud = ["openai>=1.0"]
test = ["pytest>=8"]
[project.scripts]
chimera = "chimera.cli:main"
chimera-fabric = "chimera.fabric_cli:main"
chimera-discover = "chimera.discover_cli:main"
chimera-free-pool = "chimera.free_pool:run_cli"
chimera-power-pool = "chimera.power_pool:main"
chimera-council = "chimera.council_cli:main"
chimera-route = "chimera.routing_cli:main"
chimera-benchmark = "chimera.routing_cli:benchmark_main"
chimera-experiment = "chimera.experiment:main"
chimera-agency = "chimera.agency_cli:main"
chimera-code = "chimera.coding_cli:main"
[tool.setuptools.packages.find]
include = ["chimera*"]
