[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "chimera-coordination"
version = "0.1.0"
description = "Controlled evolution of hybrid local/cloud agent coordination"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
cloud = ["openai>=1.0"]
test = ["pytest>=8"]
[project.scripts]
chimera = "chimera.cli:main"
[tool.setuptools.packages.find]
include = ["chimera*"]
