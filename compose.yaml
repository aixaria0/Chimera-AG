services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Ollama is reachable by Chimera only, never published to the public host.
    environment:
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 15s
  chimera:
    build: .
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHIMERA_MODEL: ${CHIMERA_MODEL:-qwen2.5:1.5b}
      CHIMERA_HOST: 0.0.0.0
      CHIMERA_PORT: "8080"
    ports:
      - "127.0.0.1:${CHIMERA_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  ollama_models:
